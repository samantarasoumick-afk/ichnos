# Self-hosted full stack: Postgres + FastAPI backend + Next.js frontend
# + the datafe marketing website (nginx), which is the public front
# door and reverse-proxies the app itself on an "app." subdomain.
#
# First time setup:
#   1. cp .env.example .env
#   2. Fill in SECRET_KEY / ENCRYPTION_KEY / POSTGRES_PASSWORD (see
#      comments in .env.example for how to generate real values).
#   3. docker compose up -d --build
#   4. Open http://localhost (marketing site) or
#      http://app.localhost (the app - resolves locally with no
#      /etc/hosts entry needed in most modern browsers)
#
# Only the website container (port 80) needs to be reachable by
# anyone but you - the backend and database stay on the internal
# Docker network. The frontend's own port 3000 stays published too,
# for direct access during development.

services:

  postgres:
    image: postgres:15
    container_name: datafe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-datafe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to localhost only - handy for connecting a DB client from
    # the host machine itself, not reachable from your LAN or a tunnel.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    container_name: datafe_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-datafe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-datafe}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      # Includes the marketing site's own origin (http://localhost, no
      # "app." prefix) alongside the app's - the site's tracking
      # snippet (website/index.html) calls POST /backend/api/marketing
      # /track on the app's origin cross-origin, which needs the
      # marketing site's origin in this allowlist or the browser
      # blocks it at the CORS preflight.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://app.localhost,http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://app.localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-DataFe <no-reply@datafe.local>}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY:-}
      STRIPE_PRICE_BUSINESS_YEARLY: ${STRIPE_PRICE_BUSINESS_YEARLY:-}
      AUTO_CREATE_SCHEMA: "false"
      DEMO_SEED: ${DEMO_SEED:-false}
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Also needed at build time - Next.js bakes rewrites() into
        # the build output, so the runtime-only `environment:` below
        # is too late on its own. See the comment in frontend/Dockerfile.
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: datafe_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Container-to-container hostname, not localhost - see the
      # comment in frontend/next.config.ts for why.
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

  website:
    image: nginx:1.27-alpine
    container_name: datafe_website
    restart: unless-stopped
    depends_on:
      - frontend
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./website/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
