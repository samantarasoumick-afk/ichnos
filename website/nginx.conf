# Marketing site (default) + reverse proxy to the app on an "app." subdomain.
#
# Locally, "app.localhost" resolves to 127.0.0.1 in most modern
# browsers (Chrome, Edge, Firefox) with no /etc/hosts entry needed, so
# you can test both the marketing site and the app without owning a
# real domain yet:
#   http://localhost        -> marketing site
#   http://app.localhost    -> the DataFe app
#
# Once you have a real domain, point it (and an "app." subdomain, e.g.
# via a Cloudflare Tunnel with two public hostnames) at this same
# container for both - see docs/SELF_HOSTING.md.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name ~^app\..*$;

    client_max_body_size 25m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
